---
control_plane_base_dir: /opt/moodle-control-plane
control_plane_project_name: moodle-control-plane
control_plane_image_repository: moodle-pfe/control-plane
control_plane_source_dir: "{{ playbook_dir }}/../../control-plane"
control_plane_port: 8000
control_plane_prometheus_url: http://127.0.0.1:9090
control_plane_max_scrape_age_seconds: 60
control_plane_application_metrics_enabled: false
control_plane_application_php_pool: www
control_plane_application_pg_database: "{{ application_monitoring_database | default('moodle') }}"
control_plane_memory_limit: 256m
control_plane_cpu_limit: "0.50"
control_plane_backup_status_enabled: false
control_plane_backup_catalog_enabled: false
control_plane_recovery_requests_enabled: false
control_plane_recovery_execution_enabled: false
control_plane_pilotage_backup_status_enabled: false
control_plane_backup_status_dir: /var/lib/moodle-backup-status
# Acces local au laboratoire par le port du tableau de bord ou un tunnel SSH.
# En production : origine HTTPS exacte et cookie secure=true.
control_plane_auth_origins: [http://127.0.0.1:8088, http://localhost:8088]
control_plane_auth_secure_cookie: false
control_plane_forecasts_enabled: false
control_plane_forecast_bundle_dir: ""
control_plane_forecast_features_dir: ""
control_plane_forecast_runtime_dir: "{{ control_plane_base_dir }}/forecasts"
control_plane_anomalies_enabled: false
control_plane_anomaly_bundle_dir: ""
control_plane_anomaly_features_dir: ""
control_plane_anomaly_runtime_dir: "{{ control_plane_base_dir }}/anomalies"
# Ce module est partage avec l'entrainement ; copie dans l'image sans duplication dans Git.
control_plane_isolation_source: "{{ playbook_dir }}/../../ml/isolation_model.py"
control_plane_incidents_enabled: false
control_plane_incident_data_dir: /var/lib/moodle-control-plane/incidents
control_plane_incident_observer_memory_limit: 192m
control_plane_incident_observer_cpu_limit: "0.25"
control_plane_decisions_enabled: false
control_plane_diagnostics_enabled: false
control_plane_diagnostics_data_dir: /var/lib/moodle-diagnostics
control_plane_diagnostics_store_source: "{{ playbook_dir }}/../../diagnostics/store.py"
control_plane_remediation_enabled: false
control_plane_remediation_data_dir: /var/lib/moodle-remediation
control_plane_remediation_store_source: "{{ playbook_dir }}/../../remediation/store.py"
control_plane_source_files:
  - Dockerfile
  - .dockerignore
  - requirements-lock.txt
  - pilotage/__init__.py
  - pilotage/db.py
  - pilotage/schemas.py
  - pilotage/migrate.py
  - pilotage/auth.py
  - pilotage/auth_cli.py
  - pilotage/passwords.py
  - pilotage/worker_auth.py
  - pilotage/recovery.py
  - pilotage/recovery_cli.py
  - pilotage/recovery_execution.py
  - pilotage/operating_policy.py
  - app/__init__.py
  - app/main.py
  - app/auth.py
  - app/backups.py
  - app/recovery_requests.py
  - app/operating_policy.py
  - app/backup_status.py
  - app/pilotage_backup_status.py
  - app/backup_catalog_status.py
  - app/forecasts.py
  - app/resource_history.py
  - app/anomalies.py
  - app/isolation_model.py
  - app/incidents.py
  - app/incident_signals.py
  - app/incident_observer.py
  - app/decisions.py
  - app/diagnostics_store.py
  - app/remediation_store.py
  - app/models.py
  - app/prometheus.py
  - app/application_metrics.py
  - tests/test_application_metrics.py
  - tests/test_api.py
  - tests/test_auth_api.py
  - tests/test_backups_api.py
  - tests/test_backup_catalog_api.py
  - tests/test_recovery_requests_api.py
  - tests/test_operating_policy_api.py
  - tests/test_pilotage_backups_api.py
  - tests/test_forecasts.py
  - tests/test_anomalies.py
  - tests/test_incidents.py
  - tests/test_incident_observer.py
  - tests/test_decisions.py
  - tests/test_diagnostics_api.py
  - tests/test_remediation_api.py
  - tests/test_storage_api.py

pilotage_database_config_dir: /etc/moodle-pilotage
