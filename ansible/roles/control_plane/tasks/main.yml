---
- name: Verifier les dependances du moteur de decision
  ansible.builtin.assert:
    that:
      - not (control_plane_decisions_enabled | bool) or (control_plane_incidents_enabled | bool)
      - not (control_plane_diagnostics_enabled | bool) or (control_plane_decisions_enabled | bool)
      - not (control_plane_remediation_enabled | bool) or (control_plane_decisions_enabled | bool)
    fail_msg: "Activer les incidents avant le moteur de decision."

- name: Creer les repertoires de l API
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ control_plane_base_dir }}"
    - "{{ control_plane_base_dir }}/build"
    - "{{ control_plane_base_dir }}/build/app"
    - "{{ control_plane_base_dir }}/build/pilotage"
    - "{{ control_plane_base_dir }}/build/tests"

- name: Copier les sources necessaires a l image
  ansible.builtin.copy:
    src: "{{ control_plane_source_dir }}/{{ item }}"
    dest: "{{ control_plane_base_dir }}/build/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ control_plane_source_files | difference(['app/isolation_model.py', 'app/diagnostics_store.py', 'app/remediation_store.py', 'pilotage/__init__.py', 'pilotage/db.py', 'pilotage/schemas.py', 'pilotage/migrate.py', 'pilotage/auth.py', 'pilotage/auth_cli.py', 'pilotage/passwords.py', 'pilotage/worker_auth.py']) }}"

- name: Copier le moteur numerique partage avec l entrainement
  ansible.builtin.copy:
    src: "{{ control_plane_isolation_source }}"
    dest: "{{ control_plane_base_dir }}/build/app/isolation_model.py"
    owner: root
    group: root
    mode: "0644"

- name: Copier le lecteur partage du journal des diagnostics
  ansible.builtin.copy:
    src: "{{ control_plane_diagnostics_store_source }}"
    dest: "{{ control_plane_base_dir }}/build/app/diagnostics_store.py"
    owner: root
    group: root
    mode: "0644"

- name: Copier le lecteur partage du journal de remediation
  ansible.builtin.copy:
    src: "{{ control_plane_remediation_store_source }}"
    dest: "{{ control_plane_base_dir }}/build/app/remediation_store.py"
    owner: root
    group: root
    mode: "0644"

- name: Copier le stockage PostgreSQL partage
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../pilotage/{{ item }}"
    dest: "{{ control_plane_base_dir }}/build/pilotage/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [__init__.py, db.py, schemas.py, migrate.py, auth.py, auth_cli.py, passwords.py, worker_auth.py]

- name: Verifier si PostgreSQL a ete active pour le pilotage
  ansible.builtin.stat:
    path: "{{ pilotage_database_config_dir }}/active"
  register: pilotage_database_activation

- name: Verifier si les comptes ont ete actives pour le pilotage
  ansible.builtin.stat:
    path: "{{ pilotage_database_config_dir }}/auth-active"
  register: pilotage_auth_activation

- name: Exiger PostgreSQL quand les comptes sont actifs
  ansible.builtin.assert:
    that: not pilotage_auth_activation.stat.exists or pilotage_database_activation.stat.exists

- name: Lire l identite des verifications de deploiement
  ansible.builtin.slurp:
    src: "{{ pilotage_database_config_dir }}/worker-token"
  register: control_plane_worker_token
  when: pilotage_auth_activation.stat.exists
  no_log: true

- name: Configurer les lectures protegees du deploiement
  ansible.builtin.set_fact:
    control_plane_read_headers: "{{ {'Authorization': 'Bearer ' ~ (control_plane_worker_token.content | b64decode | trim)} if pilotage_auth_activation.stat.exists else {} }}"
  no_log: true

- name: Calculer les empreintes des sources
  ansible.builtin.stat:
    path: "{{ control_plane_base_dir }}/build/{{ item }}"
    checksum_algorithm: sha256
    get_checksum: true
  loop: "{{ control_plane_source_files }}"
  register: control_plane_source_checksums

- name: Identifier la version de l image par ses sources
  ansible.builtin.set_fact:
    control_plane_image: >-
      {{ control_plane_image_repository }}:{{
      (control_plane_source_checksums.results
      | map(attribute='stat.checksum') | join('') | hash('sha256'))[:16] }}

- name: Rechercher cette image sur le serveur
  ansible.builtin.command:
    argv:
      - docker
      - image
      - ls
      - --quiet
      - --no-trunc
      - "{{ control_plane_image }}"
  register: control_plane_image_lookup
  changed_when: false

- name: Construire l image et executer les tests de l API
  ansible.builtin.command:
    argv:
      - docker
      - build
      - --tag
      - "{{ control_plane_image }}"
      - "{{ control_plane_base_dir }}/build"
  when: control_plane_image_lookup.stdout | trim | length == 0
  changed_when: true

- name: Deployer les artefacts des previsions
  ansible.builtin.include_tasks: forecasts.yml
  when: control_plane_forecasts_enabled | bool

- name: Deployer les artefacts des anomalies
  ansible.builtin.include_tasks: anomalies.yml
  when: control_plane_anomalies_enabled | bool

- name: Verifier le repertoire persistant des incidents
  ansible.builtin.assert:
    that:
      - control_plane_incident_data_dir is match('^/')
      - control_plane_incident_data_dir not in ['/', '/opt', '/var', '/var/lib']
    fail_msg: "Indiquer un repertoire absolu dedie aux incidents."
  when: control_plane_incidents_enabled | bool

- name: Creer le repertoire persistant des incidents
  ansible.builtin.file:
    path: "{{ control_plane_incident_data_dir }}"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0750"
  when: control_plane_incidents_enabled | bool

- name: Installer la configuration Docker Compose de l API
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ control_plane_base_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Valider la configuration Docker Compose
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ control_plane_base_dir }}"
      - --project-name
      - "{{ control_plane_project_name }}"
      - config
      - --quiet
  changed_when: false

- name: Demarrer le service de pilotage
  community.docker.docker_compose_v2:
    project_src: "{{ control_plane_base_dir }}"
    project_name: "{{ control_plane_project_name }}"
    state: present
    build: never
    pull: never
    recreate: auto
    wait: true
    wait_timeout: 120
  register: control_plane_deployment

- name: Recharger les modeles modifies dans une API deja demarree
  community.docker.docker_compose_v2:
    project_src: "{{ control_plane_base_dir }}"
    project_name: "{{ control_plane_project_name }}"
    state: restarted
    services:
      - api
    wait: true
    wait_timeout: 120
  when:
    - control_plane_forecasts_enabled | bool
    - control_plane_forecast_artifacts.changed
    - not control_plane_deployment.changed

- name: Verifier la sante de l API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/health"
    return_content: true
    status_code: 200
    use_proxy: false
  register: control_plane_health
  until: >-
    control_plane_health.status | default(0) == 200 and
    control_plane_health.json is defined and
    control_plane_health.json.status == 'ok' and
    control_plane_health.json.service == 'moodle-control-plane'
  retries: 6
  delay: 5

- name: Verifier la lecture de Prometheus depuis l API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/metrics/summary"
    return_content: true
    status_code: 200
    timeout: 10
    use_proxy: false
    headers: "{{ control_plane_read_headers }}"
  no_log: "{{ pilotage_auth_activation.stat.exists }}"
  register: control_plane_summary
  until: >-
    control_plane_summary.status | default(0) == 200 and
    control_plane_summary.json is defined and
    control_plane_summary.json.source == 'prometheus'
  retries: 6
  delay: 5

- name: Afficher le resume de supervision
  ansible.builtin.debug:
    var: control_plane_summary.json

- name: Verifier que les trois historiques utilisent PostgreSQL apres la bascule
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/storage/health"
    return_content: true
    status_code: 200
    use_proxy: false
  register: pilotage_storage_health
  when: pilotage_database_activation.stat.exists
  until: >-
    pilotage_storage_health.status | default(0) == 200 and
    pilotage_storage_health.json is defined and
    (pilotage_storage_health.json.stores | default({}) | length) >= 3 and
    pilotage_storage_health.json.stores.incidents.backend == 'postgresql' and
    pilotage_storage_health.json.stores.diagnostics.backend == 'postgresql' and
    pilotage_storage_health.json.stores.remediations.backend == 'postgresql'
  retries: 6
  delay: 5

- name: Verifier que les comptes et leur stockage sont actifs
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/auth/status"
    return_content: true
    status_code: 200
    use_proxy: false
  register: control_plane_auth_status
  when: pilotage_auth_activation.stat.exists
  changed_when: false
  failed_when: >-
    not (control_plane_auth_status.json.enabled | default(false) | bool) or
    (pilotage_storage_health.json.stores.accounts.backend | default('')) != 'postgresql'

- name: Verifier l endpoint des previsions
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/forecasts/summary"
    return_content: true
    status_code: 200
    timeout: 10
    use_proxy: false
    headers: "{{ control_plane_read_headers }}"
  no_log: "{{ pilotage_auth_activation.stat.exists }}"
  register: control_plane_forecasts_response
  retries: 6
  delay: 5
  until: >-
    control_plane_forecasts_response.status | default(0) == 200 and
    control_plane_forecasts_response.json is defined and
    control_plane_forecasts_response.json.status | default('') in ['available', 'unavailable']
  when: control_plane_forecasts_enabled | bool

- name: Afficher l etat des previsions
  ansible.builtin.debug:
    msg: >-
      Etat={{ control_plane_forecasts_response.json.status }},
      raison={{ control_plane_forecasts_response.json.reason | default('historique complet') }}
  when: control_plane_forecasts_enabled | bool

- name: Verifier la configuration du modele d anomalies
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/anomalies/model"
    return_content: true
    status_code: 200
    timeout: 10
    use_proxy: false
    headers: "{{ control_plane_read_headers }}"
  no_log: "{{ pilotage_auth_activation.stat.exists }}"
  register: control_plane_anomaly_model
  until: >-
    control_plane_anomaly_model.status | default(0) == 200 and
    control_plane_anomaly_model.json is defined and
    control_plane_anomaly_model.json.status | default('') == 'configured'
  retries: 6
  delay: 5
  when: control_plane_anomalies_enabled | bool

- name: Verifier l endpoint des anomalies
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/anomalies/summary"
    return_content: true
    status_code: 200
    timeout: 10
    use_proxy: false
    headers: "{{ control_plane_read_headers }}"
  no_log: "{{ pilotage_auth_activation.stat.exists }}"
  register: control_plane_anomaly_response
  until: >-
    control_plane_anomaly_response.status | default(0) == 200 and
    control_plane_anomaly_response.json is defined and
    control_plane_anomaly_response.json.status | default('') in ['available', 'unavailable']
  retries: 6
  delay: 5
  when: control_plane_anomalies_enabled | bool

- name: Afficher l etat de detection des anomalies
  ansible.builtin.debug:
    msg: >-
      Mode=observation, etat={{ control_plane_anomaly_response.json.status }},
      raison={{ control_plane_anomaly_response.json.reason | default('historique complet') }}
  when: control_plane_anomalies_enabled | bool

- name: Verifier la consultation des incidents
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/incidents/summary"
    return_content: true
    status_code: 200
    timeout: 10
    use_proxy: false
    headers: "{{ control_plane_read_headers }}"
  no_log: "{{ pilotage_auth_activation.stat.exists }}"
  register: control_plane_incidents_response
  until: >-
    control_plane_incidents_response.status | default(0) == 200 and
    control_plane_incidents_response.json is defined and
    control_plane_incidents_response.json.status | default('') == 'available'
  retries: 6
  delay: 5
  when: control_plane_incidents_enabled | bool

- name: Afficher le resume des incidents observes
  ansible.builtin.debug:
    msg: >-
      Mode=observation,
      ouverts={{ control_plane_incidents_response.json.counts.open }},
      resolus={{ control_plane_incidents_response.json.counts.resolved }},
      observateur={{ (control_plane_incidents_response.json.collector | default({}, true)).status | default('initialisation') }}
  when: control_plane_incidents_enabled | bool

- name: Verifier la simulation des decisions
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/decisions/summary"
    return_content: true
    status_code: 200
    timeout: 10
    use_proxy: false
    headers: "{{ control_plane_read_headers }}"
  no_log: "{{ pilotage_auth_activation.stat.exists }}"
  register: control_plane_decisions_response
  until: >-
    control_plane_decisions_response.status | default(0) == 200 and
    control_plane_decisions_response.json is defined and
    control_plane_decisions_response.json.status | default('') == 'available' and
    control_plane_decisions_response.json.mode | default('') == 'simulation' and
    not (control_plane_decisions_response.json.execution.enabled | default(true) | bool)
  retries: 6
  delay: 5
  when: control_plane_decisions_enabled | bool

- name: Afficher le resultat de la simulation
  ansible.builtin.debug:
    msg: >-
      Mode=simulation,
      recommandations={{ control_plane_decisions_response.json.counts.recommendation }},
      bloquees={{ control_plane_decisions_response.json.counts.blocked }},
      surveillance={{ control_plane_decisions_response.json.counts.monitoring }}
  when: control_plane_decisions_enabled | bool

- name: Verifier la consultation du journal des diagnostics
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/diagnostics/summary"
    return_content: true
    status_code: 200
    timeout: 10
    use_proxy: false
    headers: "{{ control_plane_read_headers }}"
  no_log: "{{ pilotage_auth_activation.stat.exists }}"
  register: control_plane_diagnostics_response
  until: >-
    control_plane_diagnostics_response.status | default(0) == 200 and
    control_plane_diagnostics_response.json is defined and
    control_plane_diagnostics_response.json.mode | default('') == 'manual_read_only'
  retries: 6
  delay: 5
  when: control_plane_diagnostics_enabled | bool

- name: Verifier la consultation du journal de remediation
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ control_plane_port }}/api/v1/remediations/summary"
    return_content: true
    status_code: 200
    timeout: 10
    use_proxy: false
    headers: "{{ control_plane_read_headers }}"
  no_log: "{{ pilotage_auth_activation.stat.exists }}"
  register: control_plane_remediation_response
  until: >-
    control_plane_remediation_response.status | default(0) == 200 and
    control_plane_remediation_response.json is defined and
    control_plane_remediation_response.json.mode | default('') == 'manual_guarded' and
    not (control_plane_remediation_response.json.automatic_execution_enabled | default(true) | bool)
  retries: 6
  delay: 5
  when: control_plane_remediation_enabled | bool
