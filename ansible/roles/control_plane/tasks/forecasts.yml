---
- name: Verifier les parametres des previsions
  ansible.builtin.assert:
    that:
      - control_plane_forecast_bundle_dir | length > 0
      - control_plane_forecast_bundle_dir is match('^/')
      - control_plane_forecast_features_dir | length > 0
      - control_plane_forecast_features_dir is match('^/')
      - control_plane_max_scrape_age_seconds | float == 60
    fail_msg: "Indiquer les dossiers absolus des modeles et des variables ; fraicheur attendue de 60 s."

- name: Creer le repertoire des artefacts de prevision
  ansible.builtin.file:
    path: "{{ control_plane_forecast_runtime_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copier les artefacts de prevision
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ control_plane_forecast_runtime_dir }}/{{ item.target }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - source: "{{ control_plane_forecast_bundle_dir }}/models.json"
      target: models.json
    - source: "{{ control_plane_forecast_bundle_dir }}/report.json"
      target: report.json
    - source: "{{ control_plane_forecast_features_dir }}/metadata.json"
      target: features_metadata.json
  register: control_plane_forecast_artifacts

- name: Valider les artefacts avec le code de l API
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --read-only
      - --cap-drop
      - ALL
      - --security-opt
      - no-new-privileges:true
      - --mount
      - "type=bind,src={{ control_plane_forecast_runtime_dir }},dst=/opt/forecasts,readonly"
      - "{{ control_plane_image }}"
      - python
      - -m
      - app.forecasts
      - --check-bundle
      - /opt/forecasts
  changed_when: false
