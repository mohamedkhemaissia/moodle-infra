---
diagnostics_base_dir: /opt/moodle-diagnostics
diagnostics_data_dir: /var/lib/moodle-diagnostics
diagnostics_source_dir: "{{ playbook_dir }}/../../diagnostics"
# Utiliser par defaut le Python qui execute Ansible. Il est valide a 3.12 par
# les taches du role et peut toujours etre surcharge dans l'inventaire.
diagnostics_python_source: "{{ ansible_playbook_python }}"
diagnostics_api_url: "http://127.0.0.1:{{ control_plane_port | default(8000) }}"
diagnostics_prometheus_url: http://127.0.0.1:9090
diagnostics_files:
  - __init__.py
  - store.py
  - policy.py
  - collector.py
  - run.py
  - worker.py
  - initialize.py
  - requirements-lock.txt
  - project/ansible.cfg
  - project/diagnose.yml
  - tests/test_diagnostics.py
  - tests/test_diagnostic_worker.py

pilotage_database_config_dir: /etc/moodle-pilotage
