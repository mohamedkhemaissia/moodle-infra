---
remediation_base_dir: /opt/moodle-remediation
remediation_data_dir: /var/lib/moodle-remediation
remediation_source_dir: "{{ playbook_dir }}/../../remediation"
remediation_diagnostics_source_dir: "{{ playbook_dir }}/../../diagnostics"
remediation_python: /opt/moodle-diagnostics/venv/bin/python
remediation_api_url: "http://127.0.0.1:{{ control_plane_port | default(8000) }}"
remediation_php_profiles_enabled: false
remediation_worker_enabled: true
remediation_worker_scheduler: systemd
remediation_worker_interval_seconds: 30
remediation_worker_supervisor_program: moodle-remediation-worker
remediation_probe_scheme: https
remediation_probe_hostname: moodle-pfe.test
remediation_probe_port: 8443
remediation_probe_ca_file: /opt/moodle/tls/lab-ca.crt
remediation_proxy_tls_terminated: false
remediation_operations_check_mode: systemd
remediation_test_pattern: "test_*.py"
remediation_files:
  - __init__.py
  - store.py
  - policy.py
  - probes.py
  - action.py
  - run.py
  - initialize.py
  - automatic.py
  - fpm_profiles.py
  - tests/test_fpm_profiles.py
  - project/profile-php.yml
  - tests/test_automatic.py
  - tests/test_operating_guard.py
  - project/ansible.cfg
  - project/recover-php.yml
  - tests/test_remediation.py
remediation_shared_diagnostics_files:
  - __init__.py
  - collector.py
  - policy.py
  - store.py

pilotage_database_config_dir: /etc/moodle-pilotage
