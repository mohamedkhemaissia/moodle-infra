---
- name: Verifier le perimetre et les dependances de la remediation
  ansible.builtin.assert:
    that:
      - remediation_base_dir is match('^/opt/[^/]+$')
      - remediation_data_dir is match('^/var/lib/[^/]+$')
      - remediation_data_dir == control_plane_remediation_data_dir
      - remediation_data_dir != control_plane_diagnostics_data_dir
      - not (remediation_php_profiles_enabled | bool) or (control_plane_application_metrics_enabled | bool)
      - remediation_worker_enabled is boolean
      - remediation_worker_scheduler in ['systemd', 'supervisor']
      - remediation_worker_interval_seconds | int >= 5
      - remediation_worker_interval_seconds | int <= 300
      - remediation_worker_supervisor_program is match('^[a-z][a-z0-9-]{2,63}$')
      - remediation_probe_scheme in ['http', 'https']
      - remediation_operations_check_mode in ['systemd', 'marker_only']
      - control_plane_remediation_enabled | bool
      - control_plane_decisions_enabled | bool
    fail_msg: "Indiquer un journal separe et activer le moteur de decision."

- name: Verifier l environnement Runner deja installe
  ansible.builtin.command:
    argv:
      - "{{ remediation_python }}"
      - -c
      - "import importlib.metadata as m; assert m.version('ansible-runner') == '2.4.3'; assert m.version('ansible-core') == '2.21.4'"
  changed_when: false

- name: Creer les repertoires du code de remediation
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ remediation_base_dir }}"
    - "{{ remediation_base_dir }}/code"
    - "{{ remediation_base_dir }}/code/pilotage"
    - "{{ remediation_base_dir }}/code/remediation"
    - "{{ remediation_base_dir }}/code/remediation/project"
    - "{{ remediation_base_dir }}/code/remediation/tests"
    - "{{ remediation_base_dir }}/code/diagnostics"

- name: Creer le repertoire du journal de remediation
  ansible.builtin.file:
    path: "{{ remediation_data_dir }}"
    state: directory
    owner: root
    group: "10001"
    mode: "2750"

- name: Copier les sources de la remediation et ses tests
  ansible.builtin.copy:
    src: "{{ remediation_source_dir }}/{{ item }}"
    dest: "{{ remediation_base_dir }}/code/remediation/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ remediation_files }}"
  register: remediation_sources

- name: Copier les utilitaires partages des diagnostics
  ansible.builtin.copy:
    src: "{{ remediation_diagnostics_source_dir }}/{{ item }}"
    dest: "{{ remediation_base_dir }}/code/diagnostics/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ remediation_shared_diagnostics_files }}"
  register: remediation_shared_sources

- name: Copier le stockage PostgreSQL partage
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../pilotage/{{ item }}"
    dest: "{{ remediation_base_dir }}/code/pilotage/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [__init__.py, db.py, schemas.py, migrate.py, worker_auth.py, auth.py, passwords.py, recovery.py, operating_policy.py]

- name: Verifier si PostgreSQL a ete active pour le pilotage
  ansible.builtin.stat:
    path: "{{ pilotage_database_config_dir }}/active"
  register: pilotage_database_activation

- name: Verifier si les politiques encadrent les corrections
  ansible.builtin.stat:
    path: "{{ pilotage_database_config_dir }}/policies-active"
    follow: false
  register: remediation_policy_activation

- name: Installer la configuration locale de remediation
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ remediation_base_dir }}/config.json"
    owner: root
    group: root
    mode: "0644"

- name: Verifier les conditions et l execution du module de remediation
  ansible.builtin.command:
    argv:
      - "{{ remediation_python }}"
      - -B
      - -m
      - unittest
      - discover
      - -s
      - remediation/tests
      - -p
      - "{{ remediation_test_pattern }}"
      - -q
    chdir: "{{ remediation_base_dir }}/code"
  environment:
    PILOTAGE_SERVICE_TOKEN_FILE: ''
  changed_when: false
  when: remediation_sources.changed or remediation_shared_sources.changed

- name: Initialiser le journal de remediation
  ansible.builtin.command:
    argv:
      - "{{ remediation_python }}"
      - -B
      - -m
      - remediation.initialize
    chdir: "{{ remediation_base_dir }}/code"
  environment:
    PILOTAGE_DATABASE_CONFIG: "{{ (pilotage_database_config_dir ~ '/database.json') if pilotage_database_activation.stat.exists else '' }}"
  register: remediation_initialization
  changed_when: (remediation_initialization.stdout | from_json).changed

- name: Autoriser la consultation du journal par l API
  ansible.builtin.file:
    path: "{{ remediation_data_dir }}/remediations.sqlite3"
    owner: root
    group: "10001"
    mode: "0640"
  when: not pilotage_database_activation.stat.exists

- name: Installer la commande de remediation manuelle
  ansible.builtin.template:
    src: moodle-remediate.j2
    dest: /usr/local/sbin/moodle-remediate
    owner: root
    group: root
    mode: "0755"

- name: Installer la commande bornee du worker automatique
  ansible.builtin.template:
    src: moodle-remediation-worker.j2
    dest: /usr/local/sbin/moodle-remediation-worker
    owner: root
    group: root
    mode: '0755'

- name: Installer la consultation des profils PHP-FPM
  ansible.builtin.template:
    src: moodle-fpm-profiles.j2
    dest: /usr/local/sbin/moodle-fpm-profiles
    owner: root
    group: root
    mode: "0755"
  when: remediation_php_profiles_enabled | bool

- name: Preparer les profils avec PHP sans changer le pool en service
  ansible.builtin.command:
    argv:
      - "{{ remediation_python }}"
      - -B
      - -m
      - remediation.fpm_profiles
      - --config
      - "{{ remediation_base_dir }}/config.json"
      - --prepare
    chdir: "{{ remediation_base_dir }}/code"
  environment:
    PILOTAGE_DATABASE_CONFIG: "{{ pilotage_database_config_dir }}/database.json"
    PILOTAGE_SERVICE_TOKEN_FILE: "{{ pilotage_database_config_dir }}/worker-token"
  register: remediation_profile_preparation
  changed_when: (remediation_profile_preparation.stdout | from_json).changed | default(false)
  when:
    - remediation_php_profiles_enabled | bool
    - remediation_policy_activation.stat.exists

- name: Installer la planification du worker de politiques
  ansible.builtin.template:
    src: "moodle-remediation-worker.{{ item }}.j2"
    dest: "/etc/systemd/system/moodle-remediation-worker.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [service, timer]
  register: remediation_worker_units
  when:
    - remediation_policy_activation.stat.exists
    - remediation_worker_enabled | bool
    - remediation_worker_scheduler == 'systemd'

- name: Valider les unites du worker
  ansible.builtin.command:
    argv: [/usr/bin/systemd-analyze, verify, /etc/systemd/system/moodle-remediation-worker.service, /etc/systemd/system/moodle-remediation-worker.timer]
  changed_when: false
  when:
    - remediation_policy_activation.stat.exists
    - remediation_worker_enabled | bool
    - remediation_worker_scheduler == 'systemd'

- name: Activer le worker soumis a la politique persistante
  ansible.builtin.systemd_service:
    name: moodle-remediation-worker.timer
    enabled: true
    state: started
    daemon_reload: "{{ remediation_worker_units.changed | default(false) }}"
  when:
    - remediation_policy_activation.stat.exists
    - remediation_worker_enabled | bool
    - remediation_worker_scheduler == 'systemd'

- name: Installer le worker Codespaces gere par Supervisor
  ansible.builtin.template:
    src: moodle-remediation-worker.supervisor.j2
    dest: "/etc/supervisor/conf.d/{{ remediation_worker_supervisor_program }}.conf"
    owner: root
    group: root
    mode: '0644'
  when:
    - remediation_policy_activation.stat.exists
    - remediation_worker_enabled | bool
    - remediation_worker_scheduler == 'supervisor'

- name: Verifier la configuration du worker sans reserver d action
  ansible.builtin.command:
    argv: [/usr/local/sbin/moodle-remediation-worker, --healthcheck]
  register: remediation_worker_health
  changed_when: false
  failed_when: >-
    remediation_worker_health.rc != 0 or
    (remediation_worker_health.stdout | from_json).status != 'available' or
    (remediation_worker_health.stdout | from_json).action_scope !=
    (['start_php_stopped', 'apply_php_fpm_profile'] if remediation_php_profiles_enabled | bool
    else ['start_php_stopped'])
  when:
    - remediation_policy_activation.stat.exists
    - remediation_worker_enabled | bool

- name: Recharger la configuration Supervisor de remediation
  ansible.builtin.command:
    argv: [/usr/bin/supervisorctl, reread]
  register: remediation_supervisor_reread
  changed_when: "remediation_worker_supervisor_program in remediation_supervisor_reread.stdout"
  when:
    - remediation_policy_activation.stat.exists
    - remediation_worker_enabled | bool
    - remediation_worker_scheduler == 'supervisor'

- name: Appliquer le worker Supervisor de remediation
  ansible.builtin.command:
    argv: [/usr/bin/supervisorctl, update, "{{ remediation_worker_supervisor_program }}"]
  register: remediation_supervisor_update
  changed_when: >-
    'added process group' in remediation_supervisor_update.stdout or
    'stopped:' in remediation_supervisor_update.stdout
  when:
    - remediation_policy_activation.stat.exists
    - remediation_worker_enabled | bool
    - remediation_worker_scheduler == 'supervisor'

- name: Verifier le worker de remediation sous Supervisor
  ansible.builtin.command:
    argv: [/usr/bin/supervisorctl, status, "{{ remediation_worker_supervisor_program }}"]
  register: remediation_supervisor_status
  changed_when: false
  failed_when: "'RUNNING' not in remediation_supervisor_status.stdout"
  retries: 5
  delay: 1
  until: "'RUNNING' in remediation_supervisor_status.stdout"
  when:
    - remediation_policy_activation.stat.exists
    - remediation_worker_enabled | bool
    - remediation_worker_scheduler == 'supervisor'
