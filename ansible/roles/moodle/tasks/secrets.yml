---
- name: Creer le repertoire protege des secrets
  ansible.builtin.file:
    path: "{{ moodle_base_dir }}/secrets"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generer les mots de passe initiaux
  ansible.builtin.shell:
    cmd: |
      umask 077
      moodle_generated_password="$(openssl rand -hex 32)" || exit 1
      printf 'Pfe!1-%s\n' "$moodle_generated_password" > {{ (moodle_base_dir ~ '/secrets/' ~ item) | quote }}
    creates: "{{ moodle_base_dir }}/secrets/{{ item }}"
  loop:
    - postgres_admin_password
    - moodle_db_password
    - moodle_admin_password
  no_log: true

- name: Preparer les permissions des secrets pour les conteneurs
  ansible.builtin.file:
    path: "{{ moodle_base_dir }}/secrets/{{ item }}"
    state: file
    owner: root
    group: root
    mode: '0444'
  loop:
    - postgres_admin_password
    - moodle_db_password
    - moodle_admin_password
