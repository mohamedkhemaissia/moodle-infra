---
dashboard_base_dir: /opt/moodle-dashboard
dashboard_project_name: moodle-dashboard
dashboard_image_repository: moodle-pfe/dashboard
dashboard_source_dir: "{{ playbook_dir }}/../../dashboard"
dashboard_port: 8088
dashboard_api_origin: http://127.0.0.1:8000
dashboard_memory_limit: 128m
dashboard_cpu_limit: "0.25"
pilotage_database_config_dir: /etc/moodle-pilotage
dashboard_source_files:
  - Dockerfile
  - .dockerignore
  - package.json
  - package-lock.json
  - index.html
  - vite.config.js
  - nginx.conf.template
  - start.sh
  - public/favicon.svg
  - public/Rubik.ttf
  - public/CORONA-LICENSE.txt
  - public/CORONA-SOURCE.txt
  - public/RUBIK-OFL.txt
  - src/main.jsx
  - src/Auth.jsx
  - src/Accounts.jsx
  - src/Backups.jsx
  - src/BackupCatalog.jsx
  - src/backupCatalog.js
  - src/RecoveryRequests.jsx
  - src/recoveryRequests.js
  - src/ApplicationServices.jsx
  - src/applicationMetrics.js
  - src/backups.js
  - src/backups.css
  - src/authClient.js
  - src/auth.css
  - src/App.jsx
  - src/Operations.jsx
  - src/operations.js
  - src/useReadings.js
  - src/snapshot.js
  - src/useMetrics.js
  - src/styles.css
  - src/corona.css
  - tests/snapshot.test.js
  - tests/operations.test.js
  - tests/auth.test.js
  - tests/backups.test.js
  - tests/backupCatalog.test.js
  - tests/recoveryRequests.test.js
  - tests/applications.test.js
