---
- name: Valider les parametres du suivi des sauvegardes
  ansible.builtin.assert:
    that:
      - backup_status_base_dir is match('^/opt/[a-zA-Z0-9_-]+$')
      - backup_status_output_dir is match('^/var/lib/[a-zA-Z0-9_-]+$')
      - backup_status_marker is match('^/[a-zA-Z0-9_./-]+$')
      - "'..' not in backup_status_marker"
      - backup_status_project is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,80}$')
      - backup_status_max_age_hours | float > 0
      - backup_status_max_age_hours | float <= 720

- name: Creer les repertoires du suivi
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ backup_status_base_dir }}"
    - "{{ backup_status_base_dir }}/backup_status"
    - "{{ backup_status_base_dir }}/backup_status/tests"
    - "{{ backup_status_output_dir }}"

- name: Installer le collecteur en lecture seule et ses tests
  ansible.builtin.copy:
    src: "{{ backup_status_source_dir }}/{{ item }}"
    dest: "{{ backup_status_base_dir }}/backup_status/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [__init__.py, status.py, collector.py, tests/test_status.py]

- name: Verifier les formats et les etats de sauvegarde
  ansible.builtin.command:
    argv: [/usr/bin/python3, -B, -m, unittest, discover, -s, backup_status/tests, -q]
    chdir: "{{ backup_status_base_dir }}"
  changed_when: false
  when: not ansible_check_mode

- name: Installer les unites de collecte
  ansible.builtin.template:
    src: "moodle-backup-status.{{ item }}.j2"
    dest: "/etc/systemd/system/moodle-backup-status.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  notify: Recharger la collecte des sauvegardes

- name: Valider les unites systemd
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-analyze
      - verify
      - /etc/systemd/system/moodle-backup-status.service
      - /etc/systemd/system/moodle-backup-status.timer
  changed_when: false
  when: not ansible_check_mode

- name: Appliquer la configuration de collecte
  ansible.builtin.meta: flush_handlers

- name: Activer le suivi au demarrage
  ansible.builtin.systemd_service:
    name: moodle-backup-status.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Publier un premier etat pour l API
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -B
      - -m
      - backup_status.collector
      - --marker
      - "{{ backup_status_marker }}"
      - --project
      - "{{ backup_status_project }}"
      - --max-age-hours
      - "{{ backup_status_max_age_hours | string }}"
      - --output
      - "{{ backup_status_output_dir }}/status.json"
    chdir: "{{ backup_status_base_dir }}"
  changed_when: false
  when: not ansible_check_mode
