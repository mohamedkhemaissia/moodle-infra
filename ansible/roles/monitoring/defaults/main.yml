---
monitoring_project_name: moodle-monitoring
monitoring_base_dir: /opt/moodle-monitoring

monitoring_prometheus_image: prom/prometheus:v3.13.4
monitoring_node_exporter_image: prom/node-exporter:v1.12.1

monitoring_prometheus_port: 9090
monitoring_node_exporter_port: 9100

monitoring_scrape_interval: 15s
monitoring_retention_time: 7d
monitoring_retention_size: 1GB
monitoring_alertmanager_enabled: false
monitoring_alertmanager_image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
monitoring_alertmanager_port: 9093
monitoring_alertmanager_retention: 120h
monitoring_alert_scope: moodle-pilote
monitoring_alert_email_enabled: false
monitoring_alert_smtp_smarthost: ''
monitoring_alert_smtp_from: ''
monitoring_alert_smtp_username: ''
monitoring_alert_email_to: ''
monitoring_alert_smtp_password_source: /etc/moodle-alertmanager/smtp-password
monitoring_application_metrics_enabled: false
monitoring_container_metrics_enabled: false
monitoring_container_textfile_dir: "{{ container_monitoring_textfile_dir | default('/var/lib/moodle-container-monitoring/textfile') }}"
monitoring_application_php_port: "{{ application_monitoring_php_port | default(9253) }}"
monitoring_application_postgres_port: "{{ application_monitoring_postgres_port | default(9187) }}"

monitoring_blackbox_image: prom/blackbox-exporter:v0.28.0
monitoring_blackbox_port: 9115

monitoring_moodle_hostname: moodle-pfe.test
monitoring_moodle_https_port: 8443
monitoring_moodle_target_ip: 127.0.0.1
monitoring_moodle_probe_url: "https://{{ monitoring_moodle_hostname }}:{{ monitoring_moodle_https_port }}/login/index.php"
monitoring_moodle_ca_source: /opt/moodle/tls/lab-ca.crt
monitoring_moodle_probe_headers: {}
