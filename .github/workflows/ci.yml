name: Moodle - verification continue

on:
  push:
    paths:
      - '.github/**'
      - 'ci/**'
      - 'ansible/**'
      - 'ansible.cfg'
      - 'control-plane/**'
      - 'dashboard/**'
      - 'diagnostics/**'
      - 'remediation/**'
      - 'ml/**'
      - 'scripts/**'
      - 'pilotage/**'
      - 'backup_status/**'
      - 'pilotage_backup/**'
      - 'recovery_tests/**'
      - 'tests/postgresql/**'
  pull_request:
    paths:
      - '.github/**'
      - 'ci/**'
      - 'ansible/**'
      - 'ansible.cfg'
      - 'control-plane/**'
      - 'dashboard/**'
      - 'diagnostics/**'
      - 'remediation/**'
      - 'ml/**'
      - 'scripts/**'
      - 'pilotage/**'
      - 'backup_status/**'
      - 'pilotage_backup/**'
      - 'recovery_tests/**'
      - 'tests/postgresql/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  python:
    name: Tests Python et Runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            control-plane/requirements-lock.txt
            diagnostics/requirements-lock.txt
            ml/requirements.txt
      - name: Installer les dependances verrouillees
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --timeout 120 --retries 5
          -r control-plane/requirements-lock.txt
          -r diagnostics/requirements-lock.txt
          -r ml/requirements.txt
      - name: Verifier les dependances
        run: python -m pip check
      - name: Tester la preparation CI et les composants Python
        run: python -B ci/run_python_tests.py --output "$RUNNER_TEMP/moodle-python-tests.json"
      - name: Conserver le bilan des tests
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bilan-tests-python
          path: ${{ runner.temp }}/moodle-python-tests.json
          if-no-files-found: warn
          retention-days: 14

  postgresql:
    name: PostgreSQL - migration et historiques
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: moodle_pilotage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d moodle_pilotage"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PG_TEST_ADMIN_PASSWORD: ci-postgres-only
      PG_TEST_PORT: '15432'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - name: Installer les clients de test PostgreSQL
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --timeout 120 --retries 5 -r control-plane/requirements-lock.txt
      - name: Verifier la migration et les transitions avec le compte sans superuser
        run: python -B ci/run_postgresql_tests.py
      - name: Installer le client PostgreSQL 16 pour les tests de sauvegarde
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
      - name: Verifier pg_dump et pg_restore sur une base de test isolee
        run: python -B ci/run_backup_postgresql_tests.py

  recovery-tests:
    name: Restauration isolee - conteneurs reels et donnees fictives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Se connecter a Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Ajouter DOCKERHUB_USERNAME et DOCKERHUB_TOKEN aux secrets Actions du depot."
            exit 1
          fi
          export DOCKER_CONFIG="$RUNNER_TEMP/moodle-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          login_log="$(mktemp "$RUNNER_TEMP/moodle-docker-login.XXXXXX")"
          trap 'rm -f "$login_log"' EXIT
          connected=0
          for attempt in 1 2 3; do
            echo "Connexion Docker Hub : tentative $attempt/3"
            if printf '%s' "$DOCKERHUB_TOKEN" | timeout --kill-after=5s 45s docker login --username "$DOCKERHUB_USERNAME" --password-stdin >"$login_log" 2>&1; then
              connected=1
              break
            else
              rc=$?
            fi
            cat "$login_log"
            if grep -Eiq 'unauthorized|incorrect username|authentication required|access denied|denied:|too ?many ?requests|toomanyrequests|pull rate limit' "$login_log"; then
              exit "$rc"
            fi
            if [ "$rc" -ne 124 ] && [ "$rc" -ne 137 ] && ! grep -Eiq 'deadline exceeded|Client.Timeout|i/o timeout|TLS handshake timeout|connection (reset|refused|timed out)|unexpected EOF|temporary failure|no such host|request canceled|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout' "$login_log"; then
              exit "$rc"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Docker Hub reste inaccessible apres trois tentatives reseau."
              exit "$rc"
            fi
            sleep "$((attempt * 5))"
          done
          test "$connected" -eq 1
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Installer les dependances du test isole
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --timeout 120 --retries 5 -r control-plane/requirements-lock.txt
          -r diagnostics/requirements-lock.txt
      - name: Telecharger les images de test avec tentatives reseau bornees
        run: python -B ci/pull_ci_images.py recovery-tests
      - name: Verifier le backend avec PostgreSQL PHP et HTTPS reels
        run: sudo env "DOCKER_CONFIG=$DOCKER_CONFIG" "$pythonLocation/bin/python" -B ci/run_recovery_moodle_test.py
      - name: Fermer la connexion Docker Hub
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/moodle-docker"
          if [ -d "$config" ]; then
            docker --config "$config" logout >/dev/null 2>&1 || true
            rm -f "$config/config.json"
          fi

  dashboard:
    name: Tests et build React
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  ansible:
    name: Syntaxe Ansible
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANSIBLE_CONFIG: ci/ansible.cfg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: diagnostics/requirements-lock.txt
      - run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --timeout 120 --retries 5
          -r diagnostics/requirements-lock.txt
      - name: Installer les collections du projet
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Verifier les playbooks sans les executer
        run: |
          set -euo pipefail
          found=0
          for playbook in ansible/playbooks/*.yml; do
            test -f "$playbook"
            ansible-playbook --syntax-check "$playbook"
            found=1
          done
          test "$found" -eq 1

  application-metrics:
    name: Exporteurs PHP-FPM et PostgreSQL reels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Se connecter a Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Ajouter DOCKERHUB_USERNAME et DOCKERHUB_TOKEN aux secrets Actions du depot."
            exit 1
          fi
          export DOCKER_CONFIG="$RUNNER_TEMP/moodle-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          login_log="$(mktemp "$RUNNER_TEMP/moodle-docker-login.XXXXXX")"
          trap 'rm -f "$login_log"' EXIT
          connected=0
          for attempt in 1 2 3; do
            echo "Connexion Docker Hub : tentative $attempt/3"
            if printf '%s' "$DOCKERHUB_TOKEN" | timeout --kill-after=5s 45s docker login --username "$DOCKERHUB_USERNAME" --password-stdin >"$login_log" 2>&1; then
              connected=1
              break
            else
              rc=$?
            fi
            cat "$login_log"
            if grep -Eiq 'unauthorized|incorrect username|authentication required|access denied|denied:|too ?many ?requests|toomanyrequests|pull rate limit' "$login_log"; then
              exit "$rc"
            fi
            if [ "$rc" -ne 124 ] && [ "$rc" -ne 137 ] && ! grep -Eiq 'deadline exceeded|Client.Timeout|i/o timeout|TLS handshake timeout|connection (reset|refused|timed out)|unexpected EOF|temporary failure|no such host|request canceled|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout' "$login_log"; then
              exit "$rc"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Docker Hub reste inaccessible apres trois tentatives reseau."
              exit "$rc"
            fi
            sleep "$((attempt * 5))"
          done
          test "$connected" -eq 1
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - name: Installer les dependances des verifications isolees
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --timeout 120 --retries 5
          -r control-plane/requirements-lock.txt -r diagnostics/requirements-lock.txt
      - name: Telecharger les images de test avec tentatives reseau bornees
        run: python -B ci/pull_ci_images.py application-metrics
      - name: Verifier les acces limites et les metriques reelles
        run: python -B ci/run_application_metrics_tests.py
      - name: Fermer la connexion Docker Hub
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/moodle-docker"
          if [ -d "$config" ]; then
            docker --config "$config" logout >/dev/null 2>&1 || true
            rm -f "$config/config.json"
          fi

  backup-catalog:
    name: Catalogue Restic - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10.12'
            os: ubuntu-22.04
          - python-version: '3.12.15'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verifier les contrats sur la version Python du collecteur
        run: python -B -m unittest discover -s backup_status/tests -q
      - name: Verifier la collecte sur la version Restic figee du projet
        run: python -B ci/run_backup_catalog_restic_test.py

  images:
    name: Image ${{ matrix.component }}
    needs: [python, postgresql, dashboard, ansible, application-metrics, backup-catalog, recovery-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./control-plane
          - component: dashboard
            context: ./dashboard
    env:
      CI_IMAGE: moodle-ci/${{ matrix.component }}:${{ github.sha }}
      CI_CONTAINER: moodle-ci-${{ matrix.component }}
    steps:
      - name: Se connecter a Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Ajouter DOCKERHUB_USERNAME et DOCKERHUB_TOKEN aux secrets Actions du depot."
            exit 1
          fi
          export DOCKER_CONFIG="$RUNNER_TEMP/moodle-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          login_log="$(mktemp "$RUNNER_TEMP/moodle-docker-login.XXXXXX")"
          trap 'rm -f "$login_log"' EXIT
          connected=0
          for attempt in 1 2 3; do
            echo "Connexion Docker Hub : tentative $attempt/3"
            if printf '%s' "$DOCKERHUB_TOKEN" | timeout --kill-after=5s 45s docker login --username "$DOCKERHUB_USERNAME" --password-stdin >"$login_log" 2>&1; then
              connected=1
              break
            else
              rc=$?
            fi
            cat "$login_log"
            if grep -Eiq 'unauthorized|incorrect username|authentication required|access denied|denied:|too ?many ?requests|toomanyrequests|pull rate limit' "$login_log"; then
              exit "$rc"
            fi
            if [ "$rc" -ne 124 ] && [ "$rc" -ne 137 ] && ! grep -Eiq 'deadline exceeded|Client.Timeout|i/o timeout|TLS handshake timeout|connection (reset|refused|timed out)|unexpected EOF|temporary failure|no such host|request canceled|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout' "$login_log"; then
              exit "$rc"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Docker Hub reste inaccessible apres trois tentatives reseau."
              exit "$rc"
            fi
            sleep "$((attempt * 5))"
          done
          test "$connected" -eq 1
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Assembler les modules partages du contexte API
        if: ${{ matrix.component == 'api' }}
        run: python3 -B ci/prepare_api.py --output-dir "$RUNNER_TEMP/moodle-api"
      - name: Construire et charger l image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.component == 'api' && format('{0}/moodle-api', runner.temp) || matrix.context }}
          push: false
          load: true
          tags: ${{ env.CI_IMAGE }}
          provenance: false
          sbom: false
      - name: Verifier le demarrage de l image API
        if: ${{ matrix.component == 'api' }}
        run: |
          set -euo pipefail
          docker run --detach --name "$CI_CONTAINER" --network none "$CI_IMAGE"
          ready=0
          for attempt in $(seq 1 15); do
            if docker exec "$CI_CONTAINER" python -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=2)); assert d['status']=='ok' and d['service']=='moodle-control-plane'"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Verifier le demarrage de l image dashboard
        if: ${{ matrix.component == 'dashboard' }}
        run: |
          set -euo pipefail
          docker run --detach --name "$CI_CONTAINER" --network none "$CI_IMAGE"
          ready=0
          for attempt in $(seq 1 15); do
            if docker exec "$CI_CONTAINER" wget -q -T 2 -O /dev/null http://127.0.0.1:8088/healthz; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec "$CI_CONTAINER" wget -q -T 2 -O /dev/null http://127.0.0.1:8088/Rubik.ttf
      - name: Nettoyer le conteneur de test
        if: ${{ always() }}
        run: |
          docker logs --tail 40 "$CI_CONTAINER" || true
          docker rm --force "$CI_CONTAINER" || true
      - name: Fermer la connexion Docker Hub
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/moodle-docker"
          if [ -d "$config" ]; then
            docker --config "$config" logout >/dev/null 2>&1 || true
            rm -f "$config/config.json"
          fi
