---
- name: Diagnostic autorise du pilote Moodle
  hosts: all
  gather_facts: false
  tasks:
    - name: Collecter les preuves en lecture seule
      ansible.builtin.command:
        argv:
          - "{{ diagnostic_python }}"
          - -m
          - diagnostics.collector
          - --config
          - "{{ diagnostic_config }}"
          - --incident-id
          - "{{ diagnostic_incident_id | string }}"
          - --expected
          - "{{ diagnostic_expected }}"
      changed_when: false
